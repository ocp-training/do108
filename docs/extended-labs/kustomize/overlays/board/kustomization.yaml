apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${U}-fids-kustomize
resources:
  - ../../base
replicas:
  - name: fids-web
    count: 3
labels:
  - pairs:
      environment: classroom
    includeSelectors: false
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: fids-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fids-web
        annotations:
          training.example/managed-by: kustomize
