apiVersion: apps/v1
kind: Deployment
metadata:
  name: fids-web
  labels:
    app.kubernetes.io/name: fids-web
    app.kubernetes.io/part-of: fids
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fids-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fids-web
        app.kubernetes.io/part-of: fids
    spec:
      containers:
        - name: web
          image: ghcr.io/ocp-training/fids-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FIDS_API_BASE
              value: /api
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
