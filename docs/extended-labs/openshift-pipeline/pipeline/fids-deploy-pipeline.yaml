
apiVersion: v1
kind: Namespace
metadata:
  name: fids-pipelines

---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: fids-deploy
  namespace: fids-pipelines
  labels:
    app.kubernetes.io/part-of: fids
  annotations:
    tekton.dev/displayName: Deploy the FIDS application
spec:
  description: >-
    Clone a Git repository, apply the FIDS manifests, and wait until one
    Deployment is ready. Git URL, revision, manifest path, deployment name,
    and target namespace are parameters filled in from the console.
  params:
    - name: git-url
      type: string
      default: https://github.com/ocp-training/do108.git
      description: HTTPS Git URL that contains the FIDS deploy folder.
    - name: git-revision
      type: string
      description: Branch, tag, or commit to check out.
      default: main
    - name: manifest-path
      type: string
      description: Path inside the repository to the folder src/deploy.
      default: src/deploy
    - name: deployment-name
      type: string
      description: Deployment to wait for. One of fids-db, fids-api, fids-web, fids-admin.
      default: fids-web
    - name: target-namespace
      type: string
      description: Project that receives the application. The manifests in Git say fids-app; this value replaces that namespace.
      default: fids-app
  workspaces:
    - name: shared-workspace
      description: >-
        Volume shared by the clone and the apply task. Use a volume claim
        template. An empty directory is local to one pod, and these tasks run
        in different pods, so the clone would be gone before the apply.
  tasks:
    - name: fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: DELETE_EXISTING
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: deploy-manifests
      runAfter:
        - fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: manifest_dir
          workspace: shared-workspace
      params:
        - name: SCRIPT
          value: |
            #!/usr/bin/env bash
            set -eu
            ROOT="/workspace/manifest_dir"
            SRC="$(params.manifest-path)"
            DEST="$(params.target-namespace)"

            # Apply each manifest directly, replacing the namespace if needed
            # (Assumes yq is installed in the task image; if not, edit as needed or assume manifests have correct namespace)

            for file in fids-db-secret.yaml fids-db.yaml fids-api.yaml fids-web.yaml fids-admin.yaml; do
              manifest="${ROOT}/${SRC}/${file}"
              # If the manifests do not already use the target namespace, you may need to patch them:
              # Here we patch the namespace only if it exists at the correct path for typical Kubernetes manifests
              oc apply -n "${DEST}" -f "${manifest}"
            done

            oc get deploy,svc,route -n "${DEST}"
    - name: check-health
      runAfter:
        - deploy-manifests
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            #!/usr/bin/env bash
            set -eu
            oc rollout status "deployment/$(params.deployment-name)" -n "$(params.target-namespace)" --timeout=300s
            oc get deploy "$(params.deployment-name)" -n "$(params.target-namespace)"
            oc get pods -n "$(params.target-namespace)" -l "app.kubernetes.io/name=$(params.deployment-name)"
