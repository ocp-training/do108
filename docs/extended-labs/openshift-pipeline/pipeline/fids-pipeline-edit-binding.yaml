# Lets the pipeline ServiceAccount in fids-pipelines create and update
# the FIDS application in fids-app. Import this in the console after the
# OpenShift Pipelines operator is installed and the fids-pipelines project exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fids-pipeline-edit
  namespace: fids-app
  labels:
    app.kubernetes.io/part-of: fids
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: fids-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
