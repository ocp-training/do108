apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fids-db
spec:
  serviceName: fids-db            # the headless service, which must exist first
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fids-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fids-db
        app.kubernetes.io/part-of: fids
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-15-c9s:latest
          ports:
            - containerPort: 5432
              name: postgresql
          envFrom:
            - secretRef:
                name: fids-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:           # one claim per pod, created automatically
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
