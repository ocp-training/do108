apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fids
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: fids
spec:
  project: default
  source:
    repoURL: https://github.com/ocp-training/do108.git
    targetRevision: main
    path: src/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: fids-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
