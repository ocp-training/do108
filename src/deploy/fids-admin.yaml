apiVersion: apps/v1
kind: Deployment
metadata:
  name: fids-admin
  labels:
    app.kubernetes.io/name: fids-admin
    app.kubernetes.io/part-of: fids
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fids-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fids-admin
        app.kubernetes.io/part-of: fids
    spec:
      containers:
        - name: admin
          image: ghcr.io/ocp-training/fids-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POSTGRESQL_HOST
              value: fids-db
            - name: POSTGRESQL_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: fids-db-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fids-admin
  labels:
    app.kubernetes.io/name: fids-admin
    app.kubernetes.io/part-of: fids
spec:
  selector:
    app.kubernetes.io/name: fids-admin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fids-admin
  labels:
    app.kubernetes.io/name: fids-admin
    app.kubernetes.io/part-of: fids
spec:
  to:
    kind: Service
    name: fids-admin
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
