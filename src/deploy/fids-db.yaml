apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fids-db-data
  labels:
    app.kubernetes.io/name: fids-db
    app.kubernetes.io/part-of: fids
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fids-db
  labels:
    app.kubernetes.io/name: fids-db
    app.kubernetes.io/part-of: fids
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fids-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fids-db
        app.kubernetes.io/part-of: fids
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-15-c9s:latest
          ports:
            - containerPort: 5432
              name: postgresql
          envFrom:
            - secretRef:
                name: fids-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fids-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: fids-db
  labels:
    app.kubernetes.io/name: fids-db
    app.kubernetes.io/part-of: fids
spec:
  selector:
    app.kubernetes.io/name: fids-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
