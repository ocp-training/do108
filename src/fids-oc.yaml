apiVersion: v1
kind: ServiceAccount
metadata:
  name: fids-oc
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
---
# Project admin in the namespace where this stack is applied (userN-fids).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fids-oc-admin
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: fids-oc
---
# Lets user1–user10 open a terminal on this pod (console or oc rsh).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fids-oc-users
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: User
    name: user1
  - kind: User
    name: user2
  - kind: User
    name: user3
  - kind: User
    name: user4
  - kind: User
    name: user5
  - kind: User
    name: user6
  - kind: User
    name: user7
  - kind: User
    name: user8
  - kind: User
    name: user9
  - kind: User
    name: user10
---
# Cluster-scoped: list namespaces and write RoleBindings so the SA can
# become admin on every project whose name starts with userN-fids.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fids-oc
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["project.openshift.io"]
    resources: ["projects"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["authorization.openshift.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fids-oc
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fids-oc
subjects:
  - kind: ServiceAccount
    name: fids-oc
    namespace: default
  - kind: ServiceAccount
    name: fids-oc
    namespace: final-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user1-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user2-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user3-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user4-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user5-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user6-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user7-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user8-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user9-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user10-fids
---
# Students are cluster-admin. The pod's token must be too, or oc inside
# the toolbox cannot call the API as they can from a laptop.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fids-oc-cluster-admin
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: fids-oc
    namespace: user1-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user2-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user3-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user4-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user5-fids
  - kind: ServiceAccount
    name: fids-oc
    namespace: user6-fids
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fids-oc-readme
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
data:
  README: |
    OpenShift CLI toolbox — this pod talks to THIS cluster (in-cluster token).

      oc whoami
      oc whoami --show-server
      oc get ns | grep -E '^user[0-9]+-fids'
      oc project user1-fids
      oc get all

    The ServiceAccount is cluster-admin, so oc inside this pod
    talks to this cluster's API with full rights.

    From a workstation:
      oc rsh deploy/fids-oc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fids-oc
  labels:
    app.kubernetes.io/name: fids-oc
    app.kubernetes.io/part-of: fids
  annotations:
    description: "oc toolbox. oc rsh deploy/fids-oc — in-cluster API, cluster-admin."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fids-oc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fids-oc
        app.kubernetes.io/part-of: fids
    spec:
      serviceAccountName: fids-oc
      automountServiceAccountToken: true
      containers:
        - name: oc
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              export HOME=/tmp
              here=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              grant() {
                oc get ns -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                  | grep -E '^user[0-9]+-fids' \
                  | while read -r ns; do
                      oc create rolebinding fids-oc-admin \
                        --clusterrole=admin \
                        --serviceaccount="${here}:fids-oc" \
                        --namespace="$ns" \
                        --dry-run=client -o yaml | oc apply -f - >/dev/null 2>&1 || true
                    done
              }
              while true; do
                grant || true
                sleep 60
              done
          env:
            - name: HOME
              value: /tmp
          stdin: true
          tty: true
          volumeMounts:
            - name: readme
              mountPath: /etc/fids-oc
              readOnly: true
          readinessProbe:
            exec:
              command: ["oc", "version", "--client"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: readme
          configMap:
            name: fids-oc-readme
      terminationGracePeriodSeconds: 10
